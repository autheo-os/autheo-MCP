[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "autheo-mcp"
version = "0.3.0a1"
description = "Model Context Protocol server for the Autheo blockchain, marketplace, DevHub, compute, storage, providers, nodes, and contracts."
readme = "README.md"
requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "Autheo" }
]

keywords = [
    "autheo",
    "mcp",
    "model-context-protocol",
    "blockchain",
    "cosmos",
    "evm",
    "cometbft",
    "ibc",
    "compute",
    "storage",
    "marketplace",
    "devhub",
    "web3",
    "ai"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1"
]


[project.optional-dependencies]

trust = ["PyJWT[crypto]>=2.10,<3"]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0"
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0"
]


[project.scripts]
autheo-mcp = "autheo_mcp.server:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py",
    "*_test.py"
]

asyncio_mode = "auto"


[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

ignore = [
    "E501"
]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true


[tool.coverage.run]
branch = true
source = [
    "src/autheo_mcp"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING:"
]
