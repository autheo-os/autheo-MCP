name: MCP Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,trust]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests review
      - run: python -m mypy src
      - run: python review/smoke_upgrade.py
